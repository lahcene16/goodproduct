
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>طلب المنتج</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background-color: #f2f2f2;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h4 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      margin: 10px 0 5px;
      display: block;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .radio-group {
      margin-bottom: 15px;
    }

    .radio-group input {
      margin-left: 5px;
    }

    .grid-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    input[type="submit"] {
      background-color: #000;
      color: white;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    input[type="submit"]:hover {
      background-color: #444;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <form method="post" action="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec" name="order-form">
      <h4>نموذج طلب المنتج</h4>

      <!-- اللون -->
      <label>اللون:</label>
      <div class="radio-group">
        <input type="radio" name="color" value="بني" required> بني
        <input type="radio" name="color" value="أبيض"> أبيض
      </div>

      <!-- المقاس -->
      <label for="size">المقاس:</label>
      <select id="size" name="size" required>
        <option value="">اختر المقاس</option>
        <option value="39">39</option>
        <option value="40">40</option>
        <option value="41">41</option>
        <option value="42">42</option>
      </select>

      <!-- وسيلة التوصيل -->
      <label>طريقة التوصيل:</label>
      <div class="radio-group">
        <input type="radio" name="delivery" value="عادي" required> توصيل عادي - 350 دج
        <input type="radio" name="delivery" value="سريع"> توصيل سريع - 700 دج
      </div>

      <!-- وسيلة الدفع -->
      <label>طريقة الدفع:</label>
      <div class="radio-group">
        <input type="radio" name="payment" value="عند الاستلام" required> عند الاستلام
        <input type="radio" name="payment" value="تحويل بريدي"> تحويل بريدي
      </div>

      <!-- حقل إضافي يظهر فقط في حالة الدفع المسبق -->
      <div id="transfer-info" class="hidden">
        <label for="transfer-code">أدخل رقم وصل التحويل:</label>
        <input type="text" name="transfer-code" placeholder="مثال: CCP123456" />
      </div>

      <!-- بيانات العميل -->
      <div class="grid-two">
        <div>
          <label>الاسم الكامل:</label>
          <input type="text" name="fullname" required>
        </div>

        <div>
          <label>رقم الهاتف:</label>
          <input type="text" name="phone" required>
        </div>
      </div>

      <label>عنوان التوصيل:</label>
      <textarea name="address" rows="3" required></textarea>

      <input type="submit" value="اطلب الآن">
    </form>

    <script>
      const form = document.forms["order-form"];
      const transferSection = document.getElementById("transfer-info");

      form.payment.forEach(radio => {
        radio.addEventListener("change", () => {
          transferSection.classList.toggle("hidden", radio.value !== "تحويل بريدي" || !radio.checked);
        });
      });

      form.addEventListener("submit", function(e) {
        e.preventDefault();
        const data = new FormData(form);
        fetch(form.action, {
          method: "POST",
          body: data
        })
        .then(response => {
          if (response.ok) {
            window.location.href = "https://sites.google.com/view/good-product-dz/شكرا";
          } else {
            alert("فشل الإرسال، حاول مجددًا.");
          }
        })
        .catch(error => {
          console.error("Error:", error);
          alert("حدث خطأ في الإرسال.");
        });
      });
    </script>
  </div>
</body>
</html>
